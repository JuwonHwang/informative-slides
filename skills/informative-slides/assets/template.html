<!doctype html>
<html lang="ko" data-ratio="16:9" style="--project:#1f3784">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>informative-slides 미팅 주기</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--muted:#6b6b6b;--line:#d6d6d6;--panel:#f8f9fa;
  /* 색의 의미: new(처음 보는 것), crit(중요한 것), c1~c4(텍스트와 시각 자료의 연결, 뜻 없음) */
  --new:#0284c7;--crit:#dc2626;--c1:#6d28d9;--c2:#15803d;--c3:#a16207;--c4:#475569}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);word-break:keep-all;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
/* 언어 전환: 선택하지 않은 언어의 요소를 숨긴다 */
.deck{position:fixed;inset:0;display:grid;place-items:center}
.slide{display:none;container-type:size;box-sizing:border-box;
  width:min(100vw,calc(100vh * var(--rw,16) / var(--rh,9)));height:min(calc(100vw * var(--rh,9) / var(--rw,16)),100vh);
  padding:4.5cqh 5cqw 5.5cqh;flex-direction:column;gap:calc(2.8cqh * var(--gap-s,1))}
.slide.on{display:flex}
.eyebrow{font-size:calc(1.35cqw * var(--eyebrow-s,1));color:var(--eyebrow-c,var(--muted));font-weight:var(--eyebrow-w,400);letter-spacing:var(--eyebrow-ls,.02em)}
.title{font-size:calc(2.4cqw * var(--title-s,1));font-weight:var(--title-w,700);letter-spacing:var(--title-ls,0);line-height:1.3;margin:0}
.lead{font-size:calc(2.1cqw * var(--lead-s,1));font-weight:var(--lead-w,500);line-height:1.45;margin:0;padding-left:1.2cqw;border-left:var(--lead-bar-w,.35cqw) solid var(--lead-bar-c,#9ca3af)}
/* 프로젝트 표시: 표지와 마무리 장의 프로젝트 이름을 프로젝트 색으로 쓴다. 색은 <html style="--project:…">에서 정한다 */
.project{font-size:1.5cqw;font-weight:800;letter-spacing:.02em;color:var(--project,#475569)}
.cover .project{margin-top:auto}
.project .summary{font-weight:500;color:var(--muted);margin-left:.6cqw}
/* 소속: 사용자 프로필(~/.config/informative-slides/profile.json)의 소속·팀·로고. 표지 맨 위에 둔다 */
.org{display:flex;align-items:center;gap:1cqw;font-size:1.3cqw;color:var(--muted)}
.org .logo{height:4.5cqh;width:auto;max-width:14cqw;object-fit:contain}
.cover .title{font-size:calc(3.6cqw * var(--title-s,1));margin-top:auto}
.cover .project + .title{margin-top:1.2cqh}
.cover .sub{font-size:1.8cqw;color:var(--muted);margin-bottom:auto}
ul.points{font-size:calc(2cqw * var(--body-s,1));line-height:1.5;margin:0;padding-left:1.3em}
ul.points li+li{margin-top:calc(1.2cqh * var(--li-gap,1))}
ul.points li::marker{color:var(--bullet-c,var(--muted))}
ul.points.small{font-size:calc(1.6cqw * var(--body-s,1))}
/* 불릿과 번호 항목의 서두(라벨)는 굵게 */
ul.points li strong,ol li strong{font-weight:var(--label-w,700)}
.figure{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:var(--fig-bg,var(--panel));border:var(--fig-border,0 solid transparent);border-radius:var(--fig-r,8px);padding:calc(2cqh * var(--fig-pad,1)) calc(2cqw * var(--fig-pad,1));box-sizing:border-box}
.figure svg{width:100%;height:100%}
/* 부분 서술: 왼쪽 확대 상세도, 오른쪽 전체 구조 속 위치 */
.zoom{flex:1;min-height:0;display:grid;grid-template-columns:1fr var(--side-w,34%);gap:3cqw}
.side{display:flex;flex-direction:column;gap:2cqh;min-height:0}
.locator{background:var(--panel);border-radius:8px;padding:1cqw}
.locator svg{width:100%;height:auto;display:block}
.caption{font-size:calc(1.2cqw * var(--caption-s,1));color:var(--caption-c,var(--muted));margin-top:.8cqh}
/* 방법 설명 장: 왼쪽 구조도(단계마다 지금 부분만 진하게), 오른쪽 단계 설명(지금 단계의 설명만 보인다) */
.method{flex:1;min-height:0;display:grid;grid-template-columns:1fr var(--narr-w,36%);gap:2.5cqw}
.narration{position:relative;min-height:0;background:var(--narr-bg,var(--panel));border:var(--narr-border,0 solid transparent);border-radius:var(--narr-r,8px);padding:calc(2.2cqh * var(--narr-pad,1)) calc(1.8cqw * var(--narr-pad,1));
  font-size:calc(1.6cqw * var(--narr-s,1));line-height:var(--narr-lh,1.6);box-sizing:border-box}
.narration p{margin:0}
.narration .step-name{display:block;font-weight:700;margin-bottom:1.2cqh}
table{border-collapse:collapse;font-size:calc(1.9cqw * var(--tbl-s,1))}
th,td{border-bottom:1px solid var(--tbl-line,var(--line));padding:calc(1.3cqh * var(--tbl-pad,1)) 2cqw;text-align:left}
th{font-weight:var(--th-w,600);color:var(--th-c,var(--muted));background:var(--th-bg,transparent)}
/* 강조 행: <tr class="hl"> */
tr.hl td{font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
/* 텍스트 색: 뜻이 있는 색(new, crit)과 연결 색(c1~c4) */
span.new,span.crit,span.c1,span.c2,span.c3,span.c4,td.new,td.crit,td.c1,td.c2,td.c3,td.c4{font-weight:800}
.new{color:var(--new)} .crit{color:var(--crit)}
.c1{color:var(--c1)} .c2{color:var(--c2)} .c3{color:var(--c3)} .c4{color:var(--c4)}
.source{margin-top:auto;font-size:calc(1.15cqw * var(--source-s,1));color:var(--source-c,var(--muted))}
/* 단계적 설명: data-focus에 없는 부분을 반투명하게 가린다 */
[data-part]{transition:opacity .25s}
.dim{opacity:var(--dim,.14)}
/* 단계 표시: 아직 나오지 않은 요소는 자리를 유지한 채 보이지 않는다 */
[data-step]{transition:opacity .35s ease-out}
.step-hidden{opacity:0}
/* data-only="k" 요소는 k단계에만 보인다 */
.step-off{display:none}
/* 데이터 이동: 구조도 요소의 data-at="x,y;x,y"는 i단계에 (x,y)만큼 옮긴 자리에 놓인다(구조도 좌표). 단계 사이에서는 이동이 보인다 */
svg [data-at]{transition:transform .5s cubic-bezier(.4,0,.2,1)}
/* 움직임을 끄는 경우: 인쇄, 확인 모드(?check), PDF 펼침(?steps=pages), 운영체제의 움직임 줄이기 설정 */
html.still *{transition:none!important}
/* 그림 안의 크기(글자 크기, 선 굵기, 모서리, 점선 길이)는 크기 단위로 쓴다. 크기 단위 하나는 장 너비의 0.05%이다(font-size="20"이 장 너비의 1.0%).
   --su(그림 좌표에서 크기 단위 하나의 길이)는 스크립트의 fitUnits가 그림마다 정한다. 그래서 장 안의 모든 그림에서 같은 값이 같은 크기로 보인다.
   위치와 모양의 크기(x, y, width, height)는 그림 좌표 그대로이다. 줄여 보이는 전체 그림(.whole, .locator)은 --su를 1로 두어 그림과 함께 줄어든다 */
.figure svg,.locator svg{--su:1}
.figure svg text{font-size:calc(var(--su,1) * 22px)}
svg text{font-family:inherit;fill:var(--fg)}
svg .name{font-weight:var(--name-w,700)}
svg .sub,svg .label{fill:var(--muted)}
svg .box{fill:var(--box-fill,#fff);stroke:var(--box-c,var(--fg));stroke-width:calc(var(--su,1) * var(--box-sw,2))}
/* 데이터(입력, 중간 결과, 출력, 파일)는 모서리가 각진 상자(rx="0")로 그려 처리 상자와 모양으로 구분한다 */
svg .box.data{stroke-width:calc(var(--su,1) * var(--cell-sw,1.5))} svg g:not([class]) > .box.data, svg .legend .box.data{fill:var(--cell-fill,#e9ecef)}
/* 시각 자료 색: 그룹에 텍스트와 같은 색 클래스를 붙이면 상자 테두리와 이름이 그 색, 내부가 그 색의 연한 색이 된다 */
svg g.new .box{stroke:var(--new);fill:#e0f2fe} svg g.new .name{fill:var(--new)}
svg g.crit .box{stroke:var(--crit);fill:#fee2e2} svg g.crit .name{fill:var(--crit)}
svg g.c1 .box{stroke:var(--c1);fill:#ede9fe} svg g.c1 .name{fill:var(--c1)}
svg g.c2 .box{stroke:var(--c2);fill:#dcfce7} svg g.c2 .name{fill:var(--c2)}
svg g.c3 .box{stroke:var(--c3);fill:#fef3c7} svg g.c3 .name{fill:var(--c3)}
svg g.c4 .box{stroke:var(--c4);fill:#e2e8f0} svg g.c4 .name{fill:var(--c4)}
svg text.new{fill:var(--new)} svg text.crit{fill:var(--crit)}
svg text.new,svg text.crit,svg text.c1,svg text.c2,svg text.c3,svg text.c4{font-weight:700}
svg text.c1{fill:var(--c1)} svg text.c2{fill:var(--c2)} svg text.c3{fill:var(--c3)} svg text.c4{fill:var(--c4)}
svg .cell1.new{fill:var(--new)} svg .cell1.crit{fill:var(--crit)}
/* 화살표 기본 굵기: 크기 단위 3.4(장 너비의 0.17%, 1440px 화면에서 약 2.4px). 주 경로는 그 1.75배 */
svg .edge{stroke:var(--fg);stroke-width:calc(var(--su,1) * 3.4 * var(--edge-s,1));fill:none;marker-end:var(--edge-head,url(#arrow));stroke-linejoin:var(--edge-join,miter);stroke-linecap:var(--edge-cap,butt)}
svg .cell1{fill:var(--cell-on,#4b5563)}
svg .cell0{fill:#fff;stroke:var(--fg);stroke-width:calc(var(--su,1) * var(--cell-sw,2))}
svg .edge.opt{stroke-dasharray:calc(var(--su,1) * var(--edge-da,8)) calc(var(--su,1) * var(--edge-db,6))}
/* 주 경로: 입력에서 출력으로 가는 경로. 보조 경로(.opt)와 굵기로 구분한다 */
svg .edge.main{stroke-width:calc(var(--su,1) * 3.4 * var(--edge-main,1.75) * var(--edge-s,1))}
/* 원소 연산(⊕, ⊗, exp, max): 원 안의 기호 */
svg .op circle{fill:var(--op-fill,#fff);stroke:var(--fg);stroke-width:calc(var(--su,1) * var(--op-sw,2))}
svg .op text{font-weight:700;text-anchor:middle;dominant-baseline:central}
/* 묶음: 한 모듈로 묶이는 요소를 감싸는 둥근 점선 테두리 */
svg .group{fill:var(--group-fill,none);stroke:var(--group-c,#6b7280);stroke-width:calc(var(--su,1) * var(--group-sw,1.5));stroke-dasharray:calc(var(--su,1) * var(--group-da,6)) calc(var(--su,1) * var(--group-db,5));rx:calc(var(--su,1) * var(--group-r,12px))}
/* 패널 제목 (a), (b) */
svg .panel{font-weight:700;fill:var(--fg)}
/* \( … \) 수식은 MathJax가 SVG로 그린다. 그리기 전에는 덱을 감춰 TeX 원문이 보이지 않게 한다 */
html.math-pending .deck{visibility:hidden}
mjx-container[jax="SVG"]{display:inline-block;margin:0 .08em}
svg .tex svg{overflow:visible}
/* 확대 그림(data-zoom): 전체 그림의 확대 영역 테두리, 확대도 테두리, 둘을 잇는 선 */
svg .zoom-frame{fill:none;stroke:var(--fg);stroke-width:calc(var(--su,1) * 2.5)}
svg .zoom-panel{fill:#fff;stroke:#9ca3af;stroke-width:calc(var(--su,1) * 1.5)}
svg .zoom-line{stroke:var(--fg);stroke-width:calc(var(--su,1) * 1.5);stroke-dasharray:calc(var(--su,1) * 6) calc(var(--su,1) * 5)}
.counter{position:fixed;right:1.2vw;bottom:1vh;font:inherit;font-size:12px;color:var(--muted);
  background:var(--panel);border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.counter:hover{background:var(--line)}
/* 장 바로가기: 장 번호를 누르거나 G 키로 연다 */
.toc{position:fixed;right:1.2vw;bottom:calc(1vh + 34px);z-index:8;width:min(460px,92vw);max-height:70vh;overflow:auto;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;box-sizing:border-box}
.toc button{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--fg);
  background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;line-height:1.4}
.toc button:hover{background:var(--panel)}
.toc button.cur{background:var(--panel);font-weight:700}
.toc .n{min-width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
/* 요약 장: 리캡(무엇을 왜 어떻게 했는가)을 핵심 내용 앞에 둔다 */
/* 절 구분 장: 절 번호, 절 이름, 그 절이 답하는 질문. 머리표·메시지·본문이 없다 */
.divider{justify-content:center;padding:0 7cqw;gap:2.4cqh}
.divider .kicker{font-size:1.4cqw;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.divider .title{font-size:3.8cqw;font-weight:800;line-height:1.2;max-width:80%}
.divider .sub{font-size:1.9cqw;color:var(--muted);line-height:1.5;max-width:80%;padding-top:2.4cqh;border-top:1px solid var(--line)}
/* 선택지: 선택지마다 패널 하나를 나란히. 패널마다 같은 기본 그림 */
.options{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2cqw}
.option{display:flex;flex-direction:column;min-height:0;background:var(--opt-bg,var(--panel));border:var(--opt-border,0 solid transparent);border-radius:var(--opt-r,8px);padding:calc(1.6cqh * var(--opt-pad,1)) calc(1.4cqw * var(--opt-pad,1))}
.option h3{font-size:1.7cqw;font-weight:800;margin:0}
.option.c1 h3{color:var(--c1)} .option.c2 h3{color:var(--c2)} .option.c3 h3{color:var(--c3)} .option.c4 h3{color:var(--c4)}
.option .figure{flex:1;min-height:0;margin:1cqh 0;padding:0;background:none}
.option p{font-size:calc(1.35cqw * var(--body-s,1));margin:0}
/* 수식 장: 수식 패널과 기호 설명 */
.formula{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr;gap:2.4cqh}
.formula .eq{display:flex;align-items:center;justify-content:center;background:var(--fig-bg,var(--panel));border-radius:8px;padding:3cqh 2cqw;font-size:calc(2.6cqw * var(--eq-s,1))}
/* 아직 없는 부분: 점선 테두리 */
svg g.prop .box{stroke-dasharray:calc(var(--su,1) * 8) calc(var(--su,1) * 6)}
.recap{font-size:calc(1.8cqw * var(--recap-s,1));line-height:var(--recap-lh,1.5);background:var(--recap-bg,var(--panel));border:var(--recap-border,0 solid transparent);border-radius:var(--recap-r,8px);padding:1.6cqh 1.6cqw;margin:0}
.recap strong{font-weight:700;margin-right:.8cqw}
.who{color:var(--muted);font-weight:400}
/* 확인 모드(?check): 넘친 장을 표시한다 */
.slide.overflow{outline:4px solid var(--crit);outline-offset:-4px}
.check-banner{position:fixed;top:0;left:0;right:0;z-index:9;padding:4px 10px;font-size:13px;color:#fff;background:var(--crit)}
@media print{
  html,body{height:auto}
  .deck{position:static;display:block}
  /* 인쇄에서도 장을 크기 기준 컨테이너로 둔다. 그래야 장 크기 단위(cqw, cqh)가 화면과 같이 장의 여백 안쪽을 기준으로 잡혀,
     글자와 그림이 화면과 같은 비율로 인쇄된다. 끄면 쪽 전체 폭이 기준이 되어 글자가 약 11% 커지고 줄이 넘어간다.
     Firefox는 컨테이너가 있으면 인쇄할 때 SVG 글자를 그리지 않으므로 Firefox에서만 끈다 */
  .slide{display:flex!important;width:var(--pw,1600px);height:var(--ph,900px);break-after:page;container-type:size}
  @supports (-moz-appearance:none){.slide{container-type:normal}}
  .counter,.check-banner,.toc{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none!important}
}
/* 그래프: <div class="chart" data-chart='{…}'>. 모양은 --bar-w, --bar-r, --bar-label, --chart-grid, --chart-axis, --line-w, --line-marker,
   --line-curve, --line-area, --series-label, --pt-r, --pt-alpha, --pt-stroke, --pt-shapes, --chart-fs가 정한다 */
.chart{flex:1;min-height:0;position:relative;background:var(--fig-bg,var(--panel));border:var(--fig-border,0 solid transparent);border-radius:var(--fig-r,8px);padding:calc(2cqh * var(--fig-pad,1)) calc(2cqw * var(--fig-pad,1));box-sizing:border-box}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
/* 두 그림이나 그래프를 나란히: <div class="pair"> 안에 .figure나 .chart 두 개 */
.pair{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
/* 표처럼 위에서부터 놓는 그림 패널 */
.figure.top{align-items:flex-start}
.chart svg text{fill:var(--fg)} .chart svg text.chart-tick,.chart svg text.chart-axis-label{fill:var(--muted)}
/* 강조 상자: 반드시 기억할 사실(.crit)이나 처음 보는 것(.new)을 한두 문장으로 */
.callout{font-size:calc(1.8cqw * var(--callout-s,1));line-height:1.5;margin:0;padding:1.6cqh 1.6cqw;border-radius:var(--callout-r,6px);
  --cc:var(--fg);background:var(--callout-bg,#f1f3f5);border-left:var(--callout-bar,.45cqw) solid var(--cc)}
.callout.crit{--cc:var(--crit)} .callout.new{--cc:var(--new)}
.callout strong{color:var(--cc)}
/* design:begin — scripts/design.py apply가 assets/design/catalog.json에서 고른 디자인 값을 여기에 쓴다 */
/* 처리 상자 */
:root{--box-sw:3;--box-c:#6b7280;--name-w:600}
svg rect.box:not(.data){rx:calc(var(--su,1) * 28px)}
/* 데이터 칸 */
svg rect.box.data,svg rect.cell0,svg rect.cell1{rx:calc(var(--su,1) * 3px)}
/* 화살표 */
:root{--edge-s:0.5;--edge-head-s:0.5;--edge-head:url(#arrow-small)}
/* 묶음 테두리 */
:root{--group-c:#b4bac2}
/* 원소 연산 기호 */
svg .op text{font-weight:400}
/* 강조 방식 */
:root{--dim:0.32}
svg .zoom-frame{stroke-width:calc(var(--su,1) * 1.5)}
/* 그림 패널 */
:root{--fig-pad:1.6}
/* 그래프 공통 */

<body>

<!-- 화살표 머리. 숨겨진 슬라이드 안에 두면 그려지지 않으므로 슬라이드 밖에 둔다. -->

    <marker id="arrow-wide" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,1 L10,5 L0,9 L2.5,5 z" fill="#1b1b1b"/></marker>
    <marker id="arrow-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">

</svg>

<main class="deck">
<!-- 장을 여기에 넣는다. 장 배치는 assets/layouts/, 디자인 요소는 assets/elements/에 하나씩 있다.

<!-- 수식 렌더러 MathJax 3.2.2 (TeX → SVG, Apache License 2.0). 아래 빈 script는 scripts/embed_math.py가 채운다 -->
<script>window.MathJax = { startup: { typeset: false }, tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'local' } }</script>
<script id="mathjax-lib"></script>
<script>
// 화면 비율: <html data-ratio="가로:세로"> 한 곳에서 정한다. 화면의 장 크기와 인쇄·PDF 쪽 크기가 모두 이 값을 따른다.
// 주소의 ?ratio=4:3&w=13.333(쪽 가로 인치)은 이 파일을 바꾸지 않고 한 번만 덮어쓴다(검수 화면의 PDF 저장이 쓴다).
;(() => {
  const q = new URLSearchParams(location.search)
  const ok = (v) => /^\d+(\.\d+)?:\d+(\.\d+)?$/.test(v || '')
  const ratio = ok(q.get('ratio')) ? q.get('ratio') : (ok(document.documentElement.dataset.ratio) ? document.documentElement.dataset.ratio : '16:9')
  const [rw, rh] = ratio.split(':').map(Number)
  const wIn = parseFloat(q.get('w')) > 0 ? parseFloat(q.get('w')) : 16, hIn = wIn * rh / rw
  const r = document.documentElement.style
  r.setProperty('--rw', rw); r.setProperty('--rh', rh); r.setProperty('--pw', wIn + 'in'); r.setProperty('--ph', hIn + 'in')
  const st = document.createElement('style')
  st.textContent = `@page{size:${wIn}in ${hIn}in;margin:0}`
  document.head.appendChild(st)
})()

document.querySelectorAll('[data-diagram]').forEach(el => {
  const t = document.getElementById('diagram-' + el.dataset.diagram)
  if (!t) { el.textContent = 'missing diagram: ' + el.dataset.diagram; return }
  el.appendChild(t.content.cloneNode(true))
  const focus = (el.dataset.focus || '').split(',').map(s => s.trim()).filter(Boolean)
  if (focus.length) el.querySelectorAll('[data-part]').forEach(p => {
    if (!p.dataset.part.split(/\s+/).some(x => focus.includes(x))) p.classList.add('dim')
  })
  if (el.dataset.zoom && el.dataset.detail) zoomCompose(el)
})
// 글자 크기 속성(font-size="22")은 크기 단위로 읽는다. 그림 원본에서 온 그림, 확대도, 장에 직접 쓴 그림 모두에 적용한다
document.querySelectorAll('.figure svg text[font-size], .locator svg text[font-size]').forEach(x => { x.style.fontSize = `calc(var(--su, 1) * ${parseFloat(x.getAttribute('font-size'))}px)` })
// 화살표 머리 크기는 선 굵기 배율(--edge-s)을 따르지 않고 머리 크기 배율(--edge-head-s)을 따른다.
// 머리는 선 굵기에 비례하는 표시(marker)이므로 marker 크기에 (머리 크기 배율 / 선 굵기 배율)을 곱한다.
// 두 배율이 1이면 보통 화살표 머리는 장 너비의 약 0.85%, 주 경로 머리는 그 1.75배이다.
// 선을 굵게 해도 머리가 커지지 않아야 짧은 화살표가 머리만 남지 않고 머리가 옆 라벨을 가리지 않는다
;(() => {
  const cs = getComputedStyle(document.documentElement)
  const es = parseFloat(cs.getPropertyValue('--edge-s')) || 1, hs = parseFloat(cs.getPropertyValue('--edge-head-s')) || 1
  const f = hs / es
  if (f === 1) return
  document.querySelectorAll('svg defs marker').forEach(m => ['markerWidth', 'markerHeight'].forEach(a => {
    const v = parseFloat(m.getAttribute(a)); if (v) m.setAttribute(a, v * f)
  }))
})()
// 모든 장의 그림에 --su를 미리 정한다. 그림 안 수식의 배치가 실제 글자 크기를 써야 하기 때문이다.
// --su는 장과 그림이 함께 커지고 줄어들어도 바뀌지 않으므로 한 번 재면 된다. 보이지 않는 장은 잠시 보이게 해 잰다
document.querySelectorAll('.slide').forEach(s => {
  if (!s.querySelector('.figure svg')) return
  const on = s.classList.contains('on')
  if (!on) s.classList.add('on')
  fitUnits(s)
  if (!on) s.classList.remove('on')
})
// 그림마다 --su를 정한다: 그림 좌표에서 크기 단위 하나(장 너비의 0.05%)의 길이. 그림이 줄어든 정도와 관계없이 글자와 선이 같은 크기로 보인다.
// 장과 그림은 함께 커지고 줄어들므로 한 번 잰 값은 화면 크기가 바뀌어도, 인쇄해도 맞다. 보이지 않는 장은 크기가 0이라 건너뛴다.
// 줄여 보이는 전체 그림(.whole, .locator)과 수식(.tex)은 건너뛴다
function fitUnits(root = document) {
  root.querySelectorAll('.figure svg').forEach(svg => {
    if (svg.closest('.whole, .locator, .tex')) return
    const vb = svg.viewBox && svg.viewBox.baseVal, slide = svg.closest('.slide')
    if (!vb || !vb.width || !vb.height || !slide) return
    const r = svg.getBoundingClientRect(), sw = slide.getBoundingClientRect().width
    const k = Math.min(r.width / vb.width, r.height / vb.height)
    if (k > 0 && sw > 0) svg.style.setProperty('--su', (sw * 0.0005 / k).toFixed(4))
  })
}

// 확대 그림: .figure에 data-diagram(전체 그림), data-zoom(x,y,w,h), data-detail(확대도), data-focus를 붙인다.
// 왼쪽에 전체 그림을 줄여 그리고 x,y,w,h(전체 그림의 viewBox 좌표) 영역에 테두리를 친 뒤, 연결선으로 오른쪽 확대도에 잇는다.
// data-focus는 전체 그림에, data-steps는 확대도에 적용한다.
function zoomCompose(el) {
  const NS = 'http://www.w3.org/2000/svg'
  const whole = el.querySelector('svg'), dt = document.getElementById('diagram-' + el.dataset.detail)
  if (!whole || !dt) { el.textContent = 'missing diagram: ' + el.dataset.detail; return }
  const detail = dt.content.querySelector('svg').cloneNode(true)
  const vb = s => s.getAttribute('viewBox').split(/[\s,]+/).map(Number)
  const [, , wW, wH] = vb(whole), [, , dW, dH] = vb(detail)
  const [zx, zy, zw, zh] = el.dataset.zoom.split(',').map(Number)
  const L = 380, G = 50, R = 1000 - L - G, ws = L / wW, lh = wH * ws, rh = dH * R / dW, H = Math.max(lh, rh)
  const out = document.createElementNS(NS, 'svg')
  out.setAttribute('viewBox', `0 0 1000 ${H}`)
  const put = (s, cls, x, y, w, h) => {
    s.classList.add(cls)
    for (const [k, v] of Object.entries({ x, y, width: w, height: h })) s.setAttribute(k, v)
    s.setAttribute('style', `width:${w}px;height:${h}px`)
    out.appendChild(s)
  }
  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); out.appendChild(e) }
  const wy = (H - lh) / 2, dy = (H - rh) / 2
  mk('rect', { x: L + G, y: dy, width: R, height: rh, class: 'zoom-panel' })
  put(whole, 'whole', 0, wy, L, lh)
  put(detail, 'detail', L + G, dy, R, rh)
  const rx = zx * ws, ry = wy + zy * ws, rw = zw * ws, rhh = zh * ws
  mk('rect', { x: rx, y: ry, width: rw, height: rhh, class: 'zoom-frame' })
  mk('line', { x1: rx + rw, y1: ry, x2: L + G, y2: dy, class: 'zoom-line' })
  mk('line', { x1: rx + rw, y1: ry + rhh, x2: L + G, y2: dy + rh, class: 'zoom-line' })
  el.appendChild(out)
}

// 수식: 글과 그림의 \( … \) 안을 MathJax(TeX 렌더러)로 SVG로 그린다. 분수, 근호, 큰 연산자를 포함한 TeX 표기를 그대로 쓴다.
// 글 안의 수식은 글자 크기를 따르는 인라인 SVG가 된다. 그림의 <text> 안 수식은 <text>를 글 조각과 수식 SVG로 나눈 <g class="tex">로 바꾸고,
// 글 조각의 폭을 재서 text-anchor(start, middle, end)와 기준선에 맞춰 놓는다.
// MathJax가 덱에 없으면(scripts/embed_math.py를 실행하지 않았으면) TeX 원문이 그대로 보이고, check_deck.py가 오류로 보고한다.
const TEX_RE = /\\\((.+?)\\\)/g
const hasMath = !!window.MathJax?.startup && /\\\(/.test(document.querySelector('.deck')?.textContent || '')
if (hasMath) document.documentElement.classList.add('math-pending')
function texNodes(root) {
  const out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT)
  while (w.nextNode()) if (w.currentNode.nodeValue.includes('\\(') && !w.currentNode.parentNode.closest('script,style,template')) out.push(w.currentNode)

}
function texSvg(tex, fs) {

function renderMath(root) {

  }

    const fs = parseFloat(cs.fontSize) || parseFloat(t.getAttribute('font-size')) || 20
    const anchor = t.getAttribute('text-anchor') || cs.textAnchor || 'start'

    let last = 0, m
    TEX_RE.lastIndex = 0
    while ((m = TEX_RE.exec(str))) {
      if (m.index > last) pieces.push({ text: str.slice(last, m.index) })
      pieces.push({ tex: m[1] }); last = TEX_RE.lastIndex
    }
    if (last < str.length) pieces.push({ text: str.slice(last) })

      if (pc.text !== undefined) {

      pc.el.setAttribute('y', pc.text !== undefined ? y : y - (pc.h - pc.depth))

      renderMath(document.querySelector('.deck'))
    }).catch(e => console.error('math render failed', e)).finally(() => document.documentElement.classList.remove('math-pending'))

// 그래프: <div class="chart" data-chart='{"type":"bar"|"line"|"scatter", ...}'>를 SVG로 그린다.
// 모양(막대 폭, 모서리, 값 라벨, 격자선, 축, 선 굵기, 점 표시, 곡선, 면적, 계열 이름 위치, 점 크기)은 CSS 변수에서 읽으므로

//   line:    {"type":"line","x":[1,2,3],"series":[{"name":"학습","values":[0.9,0.6,0.4],"color":"c1"}],"x_label":"epoch","y":{"label":"손실"}}
//   scatter: {"type":"scatter","series":[{"name":"A","points":[[0.1,0.3],[0.4,0.2]],"color":"c2"}],"x_label":"x","y":{"label":"y"}}
// 색은 c1~c4, new, crit, muted 중 하나이다. 강조할 범주는 "highlight":[i]로 그 범주의 막대만 진하게 남긴다.

    const boxes = [...svg.querySelectorAll('g[data-part]')].map(g => ({ g, part: g.dataset.part.split(/\s+/), rect: g.querySelector('rect.box') })).filter(b => b.rect && vis(b.rect))
    const texts = [...svg.querySelectorAll('text')].filter(vis)
    // 작은 글자: 논문 그림처럼 화면과 인쇄에서 읽히는 크기인지 본다
    // 위치 표시 그림(.locator)과 확대 그림 안의 줄인 전체 그림(.whole)은 제외한다
    texts.filter(t => !t.closest('.locator, .whole')).forEach(t => {
      const px = parseFloat(getComputedStyle(t).fontSize) * (t.getScreenCTM()?.a || 1)
      if (px < s.clientWidth * 0.00995) out.push([k, 'small-text', (px / s.clientWidth * 100).toFixed(2) + '% ' + txt(t)])
    })
    // 글자가 자기 상자 밖으로 나감
    boxes.forEach(b => {
      const r = b.rect.getBoundingClientRect()
      b.g.querySelectorAll('text').forEach(t => {
        if (!vis(t)) return
        const tr = t.getBoundingClientRect()
        if (tr.left < r.left - 1 || tr.right > r.right + 1 || tr.top < r.top - 1 || tr.bottom > r.bottom + 1) out.push([k, 'text-out', txt(t)])
      })
    })
    // 글자끼리 겹침
    for (let a = 0; a < texts.length; a++) for (let b = a + 1; b < texts.length; b++) {
      const ra = texts[a].getBoundingClientRect(), rb = texts[b].getBoundingClientRect()
      const small = Math.min(ra.width * ra.height, rb.width * rb.height)
      if (small > 0 && inter(ra, rb) > small * 0.15) out.push([k, 'text-overlap', txt(texts[a]) + ' / ' + txt(texts[b])])
    }
    // 상자 밖 라벨이 다른 상자와 겹침
    texts.filter(t => !t.closest('g[data-part] rect.box') && !boxes.some(b => b.g.contains(t))).forEach(t => {
      const own = (t.dataset.part || t.closest('[data-part]')?.dataset.part || '').split(/\s+/)
      const tr = t.getBoundingClientRect()
      boxes.forEach(b => { if (!b.part.some(p => own.includes(p)) && inter(tr, b.rect.getBoundingClientRect()) > 4) out.push([k, 'label-on-box', txt(t)]) })
    })
    // 화살표가 연결 대상이 아닌 상자를 가로지름
    svg.querySelectorAll('.edge').forEach(e => {
      const er = e.getBoundingClientRect()  // 수평·수직선은 높이나 너비가 0이다
      if ((er.width === 0 && er.height === 0) || getComputedStyle(e).display === 'none' || !e.getTotalLength) return
      const own = (e.dataset.part || '').split(/\s+/)
      const m = e.getScreenCTM(), len = e.getTotalLength()
      const pts = []
      for (let d = 0; d <= len; d += 4) { const p = e.getPointAtLength(d); pts.push(new DOMPoint(p.x, p.y).matrixTransform(m)) }
      boxes.forEach(b => {
        if (b.part.some(p => own.includes(p))) return
        const r = b.rect.getBoundingClientRect()
        if (pts.some(p => p.x > r.left + 3 && p.x < r.right - 3 && p.y > r.top + 3 && p.y < r.bottom - 3)) out.push([k, 'edge-cross', own.join('→') + ' × ' + b.part.join(' ')])
      })
    })
    // 라벨이 화살표의 선이나 머리에 덮임: 선을 따라 점을 찍고, 끝의 머리 길이 안에서는 머리 폭까지 본다
    const labels = texts.filter(t => !t.closest('.locator, .whole')).map(t => {
      const r = t.getBoundingClientRect(), h = r.height
      return { t, l: r.left + 1, r: r.right - 1, top: r.top + h * 0.2, bot: r.bottom - h * 0.15 }
    })
    const covered = new Set()
    svg.querySelectorAll('.edge').forEach(e => {
      if (e.closest('.locator, .whole') || !e.getTotalLength) return
      const cs = getComputedStyle(e), m = e.getScreenCTM()
      if (!m || cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return
      const sc = Math.hypot(m.a, m.b), w = parseFloat((cs.strokeWidth.match(/[0-9.]+/) || ['1'])[0]) * sc
      const mk = document.getElementById(((cs.markerEnd || '').match(/#([\w-]+)/) || [])[1] || '')
      const head = mk ? parseFloat(mk.getAttribute('markerWidth')) * w : 0
      const len = e.getTotalLength()
      for (let d = 0; d <= len; d += 3) {
        const q = e.getPointAtLength(d), p = new DOMPoint(q.x, q.y).matrixTransform(m)
        const rad = len - d < head / sc ? Math.max(w / 2, head * 0.4) : w / 2
        labels.forEach(b => { if (!covered.has(b.t) && p.x > b.l - rad && p.x < b.r + rad && p.y > b.top - rad && p.y < b.bot + rad) covered.add(b.t) })
      }
    })
    covered.forEach(t => out.push([k, 'text-on-edge', txt(t)]))
    // 짧은 화살표: 머리 앞에 머리 길이만큼의 선이 보이지 않는 화살표. 머리만 보이면 어디서 오는 화살표인지 읽히지 않는다
    svg.querySelectorAll('.edge').forEach(e => {
      if (e.closest('.locator, .whole') || !e.getTotalLength) return
      const cs = getComputedStyle(e), m = e.getScreenCTM()
      if (!m || cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return
      const sc = Math.hypot(m.a, m.b), w = parseFloat((cs.strokeWidth.match(/[0-9.]+/) || ['1'])[0]) * sc
      const mk = document.getElementById(((cs.markerEnd || '').match(/#([\w-]+)/) || [])[1] || '')
      const head = mk ? parseFloat(mk.getAttribute('markerWidth')) * w : 0
      const len = e.getTotalLength() * sc
      if (head && len < head * 2 - 0.5) out.push([k, 'short-edge', (e.dataset.part || 'edge') + ' ' + Math.round(len) + 'px, head ' + Math.round(head) + 'px'])
    })
    // 그림 밖
    ;[...texts, ...boxes.map(b => b.rect)].forEach(el => {
      const r = el.getBoundingClientRect()
      if (r.left < sr.left - 1 || r.right > sr.right + 1 || r.top < sr.top - 1 || r.bottom > sr.bottom + 1) out.push([k, 'out-of-figure', txt(el) || 'box'])
    })
  })
  return out
}
// 의도하지 않은 줄바꿈: <br>로 정한 줄 수보다 실제 줄이 많은 글(제목, 메시지, 리캡, 불릿, 단계 설명)을 찾는다(원칙 5)
function wrapIssues(s, k) {
  const out = []
  const shown = el => el.getClientRects().length > 0
  s.querySelectorAll('.title, .lead, .recap, ul.points li, .narration [data-only]').forEach(el => {
    if (!shown(el)) return
    const cs = getComputedStyle(el), lh = parseFloat(cs.lineHeight)
    if (!lh) return
    const brs = [...el.querySelectorAll('br')].filter(shown).length
    let h = el.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    el.querySelectorAll('.step-name').forEach(n => { if (shown(n)) h -= n.getBoundingClientRect().height + parseFloat(getComputedStyle(n).marginBottom) })
    if (h > (brs + 1) * lh + lh * 0.5) out.push([k, 'wrap', (el.innerText || '').trim().replace(/\s+/g, ' ').slice(0, 30)])
  })
  return out
}
if (/[?&]check\b/.test(location.search)) {
  Promise.all([document.fonts ? document.fonts.ready : null, mathReady]).then(() => {
    const bad = [], diag = []
    slides.forEach((s, k) => {
      // 단계마다 보이는 내용이 다르므로(data-only) 모든 단계를 잰다
      for (let st = 1; st <= stepsOf(s); st++) {
        show(k, st)
        const els = [s, ...s.querySelectorAll('.figure,.zoom,.side,.method,.narration,ul.points,table')]
        if (els.some(el => el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) { s.classList.add('overflow'); if (!bad.includes(k + 1)) bad.push(k + 1) }
        diagramIssues(s, k + 1).forEach(d => diag.push(d))
        wrapIssues(s, k + 1).forEach(d => diag.push(d))
      }
    })
    show(0)
    document.body.dataset.overflow = bad.join(',') || 'none'
    const seen = new Set()
    document.body.dataset.diagram = diag.map(d => d.join('|').replace(/;/g, ',')).filter(x => !seen.has(x) && seen.add(x)).join(';') || 'none'
    const b = document.createElement('div'); b.className = 'check-banner'
    b.textContent = (bad.length ? 'Overflow: ' + bad.join(', ') : 'No overflow') + (diag.length ? ' · Diagram issues: ' + diag.length : ' · Diagrams OK')
    if (!bad.length && !diag.length) b.style.background = '#15803d'
    document.body.appendChild(b)
  })
}
