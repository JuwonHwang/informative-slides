<!-- 요소: 단계 설명 (narration) · 묶음: 텍스트 상자
     그림 옆에서 단계마다 바뀌는 설명 상자
     쓰는 법: <template>이 있으면 덱의 <main class="deck"> 앞에 두고, <section>은 장 자리에 넣은 뒤 내용을 문서의 것으로 바꾼다.
     생김새(선 굵기, 모서리, 색, 글자 크기)는 템플릿 CSS가 정하므로 클래스만 쓰고 style 값을 쓰지 않는다. 규칙은 rules/slides.md 5절과 9절이다.
     예시의 수치와 이름은 설명용이므로 옮겨 오지 않는다. 그림 원본: diagram-cycle. 덱에 같은 id가 있으면 이름을 바꾼다. -->
<template id="diagram-cycle">

  <svg viewBox="0 0 1000 560" role="img" aria-label="informative-slides">

    </g>
    <path class="edge" data-part="goal goalmd" d="M135,140 L135,218"/>

    <g data-part="meeting">
      <rect class="box" x="750" y="220" width="230" height="120" rx="10"/>
      <text class="name" x="865" y="270" text-anchor="middle" font-size="26">③ 미팅</text>
      <text class="sub" x="865" y="308" text-anchor="middle" font-size="22">사용자가 결정</text>
    </g>
    <path class="edge main" data-part="meeting after" d="M865,340 L865,416"/>
    <text class="label" data-part="meeting after" x="851" y="374" text-anchor="end" font-size="20">사용자가 정한 것</text>

    <g data-part="after">
      <rect class="box" x="750" y="420" width="230" height="120" rx="10"/>
      <text class="name" x="865" y="470" text-anchor="middle" font-size="26">④ 노트 작성</text>
      <text class="sub" x="865" y="508" text-anchor="middle" font-size="22">(meet)</text>
    </g>
    <path class="edge main" data-part="after note" d="M750,480 L619,480"/>
    <path class="edge opt" data-part="after goalmd" d="M980,480 L992,480 L992,180 L318,180 L318,240 L254,240"/>

    <g data-part="note" class="new">

      <text class="name" x="500" y="470" text-anchor="middle" font-size="26">note.md</text>
      <text class="sub" x="500" y="508" text-anchor="middle" font-size="22">결정·할 일·질문</text>

    <rect class="cell1 new" data-part="meeting note" data-at="0,0;0,0;0,0;0,0;-370,200" x="946" y="300" width="26" height="26" rx="3"/>

    </g>
  </svg>
</template>
<section class="slide" data-layout="method">
  <div class="eyebrow">미팅 주기 구조</div>
  <h2 class="title">informative-slides 미팅 주기 전체 구조 (스킬 3개, 기록 2개)</h2>
  <p class="lead">미팅 노트가 다음 미팅 자료의 리마인드가 되어 미팅이 한 주기로 이어진다.</p>
  <div class="method">
    <div class="figure" data-diagram="cycle" data-steps="walk;meeting"></div>
    <div class="narration">
      <p data-only="1"><span class="step-name">② 자료 준비 (meet)</span>미팅에서 결정할 근거를 만든다.<br>meet 스킬이 GOAL.md와 지난 노트를 읽어<br>설명 자료를 만든다.</p>
      <p data-only="2"><span class="step-name">③ 미팅</span>사용자가 설명 자료로<br>방법과 결과를 확인하고 정한다.</p>
    </div>
  </div>
  <div class="source">출처: skills/*/SKILL.md</div>
</section>
