<!-- 장 배치: divider · 절 구분: 절 번호와 수, 절 이름, 그 절이 답하는 질문
     쓰는 법: <template>이 있으면 덱의 <main class="deck"> 앞에 두고, <section>은 장 자리에 넣은 뒤 내용을 문서의 것으로 바꾼다.
     규칙은 rules/slides.md 5절(요소별 표현)과 9절(템플릿 구성 요소)이다. 예시의 수치와 이름은 설명용이므로 옮겨 오지 않는다. -->
<section class="slide divider" data-layout="divider">
  <div class="kicker">2절 / 2</div>
  <div class="title">결정별 기록 위치</div>
  <div class="sub">미팅에서 정한 것은 미팅 노트와 GOAL.md 중 어디에 남는가</div>
</section>
