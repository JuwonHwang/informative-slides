<!-- 장 배치: zoom · 확대: 전체 그림 위의 확대 영역과 확대도, 오른쪽 설명
     쓰는 법: <template>이 있으면 덱의 <main class="deck"> 앞에 두고, <section>은 장 자리에 넣은 뒤 내용을 문서의 것으로 바꾼다.

<!-- 전체 구조도. 한 번만 정의하고 data-diagram으로 불러온다. 각 부분에 data-part를 붙인다. -->
<template id="diagram-cycle">
